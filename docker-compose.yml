services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peanutbutter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peanutbutter}
      POSTGRES_DB: ${POSTGRES_DB:-peanutbutter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peanutbutter} -d ${POSTGRES_DB:-peanutbutter}"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5433:5432"

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-peanutbutter_meili_master_key_change_me}
      MEILI_ENV: production
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "7700:7700"

  api:
    image: peanutbutter-api:${PEANUTBUTTER_TAG:-0.2.0}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-peanutbutter}:${POSTGRES_PASSWORD:-peanutbutter}@postgres:5432/${POSTGRES_DB:-peanutbutter}
      MEILI_URL: http://meilisearch:7700
      BIND_ADDR: 0.0.0.0:8080
      MEDIA_PATH: /media
    volumes:
      - ${MEDIA_PATH:-./media}:/media
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    ports:
      - "3001:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:
  meili_data:
