include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Vendored third-party plugin sources and generated platform glue — not app code.
    - linux/third_party/**
    - "**/flutter/ephemeral/**"
    - build/**

linter:
  rules:
    prefer_const_constructors: true
    avoid_print: true
    prefer_final_fields: true
    constant_identifier_names: false
