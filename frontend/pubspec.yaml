name: peanutbutter
description: Self-hosted media catalog for your own library (TMDB / OMDb / AniList metadata).
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  graphql: ^5.1.3
  graphql_flutter: ^5.1.2
  flutter_riverpod: ^2.5.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  video_player: ^2.9.2
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  libtorrent_flutter: ^2.0.0
  webview_flutter: ^4.10.0
  linux_embedded_webview:
    path: plugins/linux_embedded_webview
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  dio: ^5.7.0
  flutter_dotenv: ^5.2.1
  go_router: ^14.6.2
  multicast_dns: ^0.3.2+6
  network_info_plus: ^6.1.1
  collection: ^1.18.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  file_picker: ^8.1.7
  archive: ^4.2.0
  youtube_explode_dart: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
