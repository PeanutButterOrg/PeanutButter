# Homelab / VPS stack — self-contained (no .env file required)
#
#   docker compose -f docker-compose.server.yml up -d --build
#
# Set PUBLIC_URL to the URL clients use to reach this host (LAN IP or domain).
#
# Console:  http://YOUR_SERVER:3001/
# Health:   http://YOUR_SERVER:3001/health

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: peanutbutter
      POSTGRES_PASSWORD: peanutbutter
      POSTGRES_DB: peanutbutter
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - max_connections=60
      - -c
      - wal_compression=on
      - -c
      - checkpoint_completion_target=0.9
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peanutbutter -d peanutbutter"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 1g

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    logging: *default-logging
    environment:
      MEILI_MASTER_KEY: peanutbutter_meili_master_key_change_me
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 512Mb
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 768m

  api:
    image: peanutbutter-api:0.2.0
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    logging: *default-logging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://peanutbutter:peanutbutter@postgres:5432/peanutbutter
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: peanutbutter_meili_master_key_change_me
      BIND_ADDR: 0.0.0.0:8080
      MEDIA_PATH: /media
      # Clients must use this exact URL (edit before deploy)
      PUBLIC_URL: http://localhost:3001
      TMDB_API_KEY: ""
      OMDB_API_KEY: ""
      ANILIST_CLIENT_ID: ""
      ADMIN_PASSWORD: ""
      API_KEY: ""
      JACKETT_URL: ""
      JACKETT_API_KEY: ""
      SYNC_CRON_POPULAR: "0 0 */6 * * *"
      SYNC_CRON_STALE: "0 30 3 * * *"
      RUST_LOG: peanutbutter=info,tower_http=info
    volumes:
      - ./media:/media:ro
      - stream_data:/data/streams
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    ports:
      - "3001:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    mem_limit: 1g

volumes:
  postgres_data:
  meili_data:
  stream_data:
