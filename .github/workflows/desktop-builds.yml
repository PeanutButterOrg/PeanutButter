# Build PeanutButter desktop clients (Windows / macOS / Linux)
#
# Artifacts (upload raw files/folders — Actions already zips on download):
#   Linux  — portable/ | .deb | .AppImage
#   macOS  — .app
#   Windows — portable/ | setup.exe
#
# Native Windows/macOS binaries must be compiled on those OSes.
# Local Linux (fast, Docker): ./scripts/build-desktop-docker.sh
# Selective CI: ./scripts/build-desktop-docker.sh --ci-windows --ci-macos --watch --download

name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      linux:
        description: Build Linux (deb + AppImage + portable)
        type: boolean
        default: true
      windows:
        description: Build Windows (portable + setup exe)
        type: boolean
        default: true
      macos:
        description: Build macOS (universal .app)
        type: boolean
        default: true
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "frontend/**"
      - "packaging/**"
      - "scripts/package-linux.sh"
      - "scripts/build-desktop-docker.sh"
      - ".github/workflows/desktop-builds.yml"

concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (deb + AppImage + portable)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.linux }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev mpv \
            libwebkit2gtk-4.1-dev \
            dpkg-dev rsync curl file \
            python3-pil

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package portable / deb / AppImage
        working-directory: .
        run: |
          chmod +x scripts/package-linux.sh
          mkdir -p frontend/dist/PeanutButter
          cp -a frontend/build/linux/x64/release/bundle/. frontend/dist/PeanutButter/
          printf '%s\n' '#!/usr/bin/env bash' 'cd "$(dirname "$0")"' \
            'export LD_LIBRARY_PATH="$PWD/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'exec ./peanutbutter "$@"' > frontend/dist/PeanutButter/run.sh
          chmod +x frontend/dist/PeanutButter/run.sh frontend/dist/PeanutButter/peanutbutter
          ./scripts/package-linux.sh frontend/build/linux/x64/release/bundle
          ls -lh frontend/dist/

      # Upload folders/files directly — Actions zips once on download (no zip-in-zip).
      - uses: actions/upload-artifact@v4
        with:
          name: PeanutButter-linux-portable
          path: frontend/dist/PeanutButter/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PeanutButter-linux-deb
          path: frontend/dist/PeanutButter-linux-amd64.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PeanutButter-linux-appimage
          path: frontend/dist/PeanutButter-linux-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows (portable + setup)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      # cmake -E tar cannot extract through Flutter's .plugin_symlinks junction.
      # Pre-seed the DLL into the real pub-cache package so the plugin skips unzip.
      - name: Preseed libtorrent_flutter Windows prebuilt
        shell: pwsh
        run: |
          $ver = "2.0.0"
          $lock = Get-Content -Raw pubspec.lock
          if ($lock -match '(?s)libtorrent_flutter:.*?version:\s*"([^"]+)"') {
            $ver = $Matches[1]
          }
          $pkg = Join-Path $env:PUB_CACHE "hosted\pub.dev\libtorrent_flutter-$ver"
          if (-not (Test-Path $pkg)) {
            throw "libtorrent_flutter package not found at $pkg"
          }
          $dest = Join-Path $pkg "prebuilt\windows\x64"
          $dll = Join-Path $dest "libtorrent_flutter.dll"
          if (Test-Path $dll) {
            Write-Host "Prebuilt already present: $dll"
            exit 0
          }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $url = "https://github.com/ayman708-UX/libtorrent_flutter/releases/download/v$ver/windows-native-lib-x64.zip"
          $zip = Join-Path $env:RUNNER_TEMP "libtorrent-windows-x64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          if (-not (Test-Path $dll)) {
            $found = Get-ChildItem -Path $dest -Recurse -Filter "libtorrent_flutter.dll" |
              Select-Object -First 1
            if ($null -eq $found) {
              Get-ChildItem -Recurse $dest | Select-Object -ExpandProperty FullName
              throw "Expected $dll after extract"
            }
            Get-ChildItem -Path $found.DirectoryName -File | ForEach-Object {
              Copy-Item -Force $_.FullName (Join-Path $dest $_.Name)
            }
          }
          if (-not (Test-Path $dll)) {
            throw "Expected $dll after extract"
          }
          Write-Host "Seeded $dll"

      - run: flutter build windows --release

      - name: Resolve release dir
        id: winout
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          if (-not (Test-Path (Join-Path $src "peanutbutter.exe"))) {
            $src = Get-ChildItem -Path "build\windows" -Recurse -Directory -Filter Release |
              Where-Object { Test-Path (Join-Path $_.FullName "peanutbutter.exe") } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $src -or -not (Test-Path (Join-Path $src "peanutbutter.exe"))) {
            throw "peanutbutter.exe not found"
          }
          Write-Host "Release dir: $src"
          "dir=$src" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Stage portable folder
        shell: pwsh
        run: |
          $src = "${{ steps.winout.outputs.dir }}"
          $stage = "dist\PeanutButter"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force "$src\*" $stage
          Get-ChildItem $stage | Select-Object -First 10 Name

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /? | Select-Object -First 3

      - name: Build setup exe
        shell: pwsh
        working-directory: .
        run: |
          $ver = (Select-String -Path frontend\pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches.Groups[1].Value
          if (-not $ver) { $ver = "0.2.0" }
          New-Item -ItemType Directory -Force -Path frontend\dist | Out-Null
          $src = (Resolve-Path "frontend\${{ steps.winout.outputs.dir }}").Path
          $out = (Resolve-Path "frontend\dist").Path
          $icon = (Resolve-Path "frontend\windows\runner\resources\app_icon.ico").Path
          $iss = (Resolve-Path "packaging\windows\peanutbutter.iss").Path
          if (-not (Test-Path (Join-Path $src "peanutbutter.exe"))) {
            throw "Missing peanutbutter.exe in $src"
          }
          Write-Host "ISCC source=$src"
          Write-Host "ISCC output=$out"
          Write-Host "ISCC icon=$icon"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$ver" `
            "/DMyAppSource=$src" `
            "/DMyAppOutputDir=$out" `
            "/DMyAppIcon=$icon" `
            $iss
          $setup = "frontend\dist\PeanutButter-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) {
            throw "setup exe was not produced"
          }
          Get-ChildItem frontend\dist

      - uses: actions/upload-artifact@v4
        with:
          name: PeanutButter-windows-portable
          path: frontend/dist/PeanutButter/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PeanutButter-windows-setup
          path: frontend/dist/PeanutButter-windows-x64-setup.exe
          if-no-files-found: error

  macos:
    name: macOS (universal arm64 + x86_64)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.macos }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get

      - name: Build universal macOS release
        run: |
          # Release.xcconfig: ARCHS=arm64 x86_64, ONLY_ACTIVE_ARCH=NO
          flutter build macos --release
          APP="build/macos/Build/Products/Release/peanutbutter.app"
          if [ ! -d "$APP" ]; then
            APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          fi
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "macOS .app bundle not found" >&2
            ls -la build/macos/Build/Products/Release || true
            exit 1
          fi
          BIN=$(find "$APP/Contents/MacOS" -type f | head -1)
          echo "Binary: $BIN"
          file "$BIN" || true
          lipo -info "$BIN" || true
          ARCHS="$(lipo -archs "$BIN" 2>/dev/null || true)"
          echo "Architectures: $ARCHS"
          if ! echo " $ARCHS " | grep -q " arm64 " || ! echo " $ARCHS " | grep -q " x86_64 "; then
            echo "Forcing universal xcodebuild (arm64 + x86_64)"
            (
              cd macos
              xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
                ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
                -destination 'generic/platform=macOS' build
            )
            APP="build/macos/Build/Products/Release/peanutbutter.app"
            if [ ! -d "$APP" ]; then
              APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
            fi
            BIN=$(find "$APP/Contents/MacOS" -type f | head -1)
            file "$BIN" || true
            lipo -info "$BIN" || true
          fi
          mkdir -p dist
          rm -rf dist/PeanutButter.app
          ditto "$APP" dist/PeanutButter.app

      - uses: actions/upload-artifact@v4
        with:
          name: PeanutButter-macos-universal
          path: frontend/dist/PeanutButter.app
          if-no-files-found: error
