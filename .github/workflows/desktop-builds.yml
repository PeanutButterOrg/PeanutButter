# Build PeanutButter desktop clients (Windows / macOS / Linux)
#
# Native Windows and macOS binaries must be compiled on those OSes
# (Flutter cannot cross-compile desktop from Linux).
# Artifacts are uploaded on every push to main (and on version tags).

name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "frontend/**"
      - ".github/workflows/desktop-builds.yml"

concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev mpv \
            libwebkit2gtk-4.1-dev

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package zip
        run: |
          mkdir -p dist/PeanutButter
          cp -a build/linux/x64/release/bundle/. dist/PeanutButter/
          printf '%s\n' '#!/usr/bin/env bash' 'cd "$(dirname "$0")"' \
            'export LD_LIBRARY_PATH="$PWD/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'exec ./peanutbutter "$@"' > dist/PeanutButter/run.sh
          chmod +x dist/PeanutButter/run.sh dist/PeanutButter/peanutbutter
          (cd dist && zip -qr PeanutButter-linux-x64.zip PeanutButter)

      - uses: actions/upload-artifact@v4
        with:
          name: PeanutButter-linux-x64
          path: frontend/dist/PeanutButter-linux-x64.zip
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      # cmake -E tar cannot extract through Flutter's .plugin_symlinks junction.
      # Pre-seed the DLL into the real pub-cache package so the plugin skips unzip.
      - name: Preseed libtorrent_flutter Windows prebuilt
        shell: pwsh
        run: |
          $ver = "2.0.0"
          $lock = Get-Content -Raw pubspec.lock
          if ($lock -match '(?s)libtorrent_flutter:.*?version:\s*"([^"]+)"') {
            $ver = $Matches[1]
          }
          $pkg = Join-Path $env:PUB_CACHE "hosted\pub.dev\libtorrent_flutter-$ver"
          if (-not (Test-Path $pkg)) {
            throw "libtorrent_flutter package not found at $pkg"
          }
          $dest = Join-Path $pkg "prebuilt\windows\x64"
          $dll = Join-Path $dest "libtorrent_flutter.dll"
          if (Test-Path $dll) {
            Write-Host "Prebuilt already present: $dll"
            exit 0
          }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $url = "https://github.com/ayman708-UX/libtorrent_flutter/releases/download/v$ver/windows-native-lib-x64.zip"
          $zip = Join-Path $env:RUNNER_TEMP "libtorrent-windows-x64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          if (-not (Test-Path $dll)) {
            $found = Get-ChildItem -Path $dest -Recurse -Filter "libtorrent_flutter.dll" |
              Select-Object -First 1
            if ($null -eq $found) {
              Get-ChildItem -Recurse $dest | Select-Object -ExpandProperty FullName
              throw "Expected $dll after extract"
            }
            Get-ChildItem -Path $found.DirectoryName -File | ForEach-Object {
              Copy-Item -Force $_.FullName (Join-Path $dest $_.Name)
            }
          }
          if (-not (Test-Path $dll)) {
            throw "Expected $dll after extract"
          }
          Write-Host "Seeded $dll"

      - run: flutter build windows --release

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $src = "build\windows\x64\runner\Release"
          if (-not (Test-Path $src)) {
            $src = Get-ChildItem -Path "build\windows" -Recurse -Directory -Filter Release |
              Where-Object { Test-Path (Join-Path $_.FullName "peanutbutter.exe") } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          Compress-Archive -Path "$src\*" -DestinationPath "dist\PeanutButter-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PeanutButter-windows-x64
          path: frontend/dist/PeanutButter-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release

      - name: Package zip
        run: |
          mkdir -p dist
          APP="build/macos/Build/Products/Release/peanutbutter.app"
          if [ ! -d "$APP" ]; then
            APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          fi
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "macOS .app bundle not found" >&2
            ls -la build/macos/Build/Products/Release || true
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/PeanutButter-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PeanutButter-macos
          path: frontend/dist/PeanutButter-macos.zip
          if-no-files-found: error
