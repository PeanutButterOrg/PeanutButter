# Build PeanutButter client platforms (Linux / Windows / macOS / Android TV)
#
# Artifacts are the real deliverables — not zips of zips. upload-artifact already
# wraps each upload once; after you download/unzip from Actions you get:
#   PeanutButter/                          (Linux portable folder)
#   PeanutButter-linux-amd64.deb
#   PeanutButter-linux-x86_64.AppImage
#   PeanutButter/                          (Windows portable folder)
#   PeanutButter-windows-x64-setup.exe
#   PeanutButter-macos-universal.zip       (ditto zip → PeanutButter.app; compression-level 0)
#   PeanutButter-android-tv.apk            (universal — any TV box)
#   PeanutButter-android-tv-arm64-v8a.apk / -armeabi-v7a.apk (smaller, per CPU)
#
# macOS: never upload a raw .app directory — Actions' zip breaks Frameworks
# symlinks. We ditto-zip the bundle, then upload with compression-level: 0 so
# the downloaded artifact is that zip (open it to get PeanutButter.app).
# Server / API images are built separately: .github/workflows/backend-docker.yml
#
# Local Linux (fast, Docker): ./scripts/build-desktop-docker.sh
# Selective CI: ./scripts/build-desktop-docker.sh --ci-windows --ci-macos --watch --download

name: Platform Builds

on:
  workflow_dispatch:
    inputs:
      linux:
        description: Build Linux (deb + AppImage + portable)
        type: boolean
        default: true
      windows:
        description: Build Windows (portable + setup)
        type: boolean
        default: true
      macos:
        description: Build macOS (universal app)
        type: boolean
        default: true
      android_tv:
        description: Build Android TV APK
        type: boolean
        default: true
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "frontend/**"
      - "packaging/**"
      - "scripts/package-linux.sh"
      - "scripts/build-desktop-docker.sh"
      - "android-native/**"
      - ".github/workflows/desktop-builds.yml"

concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast correctness gate for the Flutter client. Fails only on analyzer
  # *errors* and failing tests (existing warnings/infos are reported, not fatal).
  flutter-checks:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  linux:
    name: Linux (deb + AppImage + portable)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.linux }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev mpv \
            libwebkit2gtk-4.1-dev \
            libtorrent-rasterbar-dev libboost-dev libssl-dev \
            dpkg-dev rsync curl file \
            python3-pil zip

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package portable / deb / AppImage
        working-directory: .
        run: |
          chmod +x scripts/package-linux.sh scripts/bundle-mpv-runtime.sh
          mkdir -p frontend/dist/PeanutButter
          cp -a frontend/build/linux/x64/release/bundle/. frontend/dist/PeanutButter/
          ./scripts/bundle-mpv-runtime.sh frontend/dist/PeanutButter/lib
          ./scripts/bundle-mpv-runtime.sh frontend/build/linux/x64/release/bundle/lib
          printf '%s\n' '#!/usr/bin/env bash' 'cd "$(dirname "$0")"' \
            'export LD_LIBRARY_PATH="$PWD/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'exec ./peanutbutter "$@"' > frontend/dist/PeanutButter/run.sh
          chmod +x frontend/dist/PeanutButter/run.sh frontend/dist/PeanutButter/peanutbutter
          ./scripts/package-linux.sh frontend/build/linux/x64/release/bundle
          ls -lh frontend/dist/PeanutButter frontend/dist/*.deb frontend/dist/*.AppImage

      # Upload raw files/folders — Actions wraps once; no zip-in-zip.
      - uses: actions/upload-artifact@v4
        with:
          name: PeanutButter-linux-portable
          path: frontend/dist/PeanutButter/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PeanutButter-linux-deb
          path: frontend/dist/PeanutButter-linux-amd64.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PeanutButter-linux-appimage
          path: frontend/dist/PeanutButter-linux-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows (portable + setup)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      # Upstream's prebuilt DLL download is gone (404). Unless a DLL is
      # committed under plugins/libtorrent_flutter/prebuilt/windows/x64/, the
      # plugin builds from source against this static vcpkg libtorrent.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-libtorrent-x64-windows-static-md-v1
      - name: Install libtorrent (vcpkg, static)
        shell: pwsh
        run: |
          if (Test-Path "plugins/libtorrent_flutter/prebuilt/windows/x64/libtorrent_flutter.dll") {
            Write-Host "Using committed prebuilt DLL"
            exit 0
          }
          $cache = Join-Path $env:RUNNER_TEMP "vcpkg-bincache"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$cache,readwrite"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libtorrent:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install libtorrent failed" }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - run: flutter build windows --release

      - name: Resolve release dir
        id: winout
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          if (-not (Test-Path (Join-Path $src "peanutbutter.exe"))) {
            $src = Get-ChildItem -Path "build\windows" -Recurse -Directory -Filter Release |
              Where-Object { Test-Path (Join-Path $_.FullName "peanutbutter.exe") } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $src -or -not (Test-Path (Join-Path $src "peanutbutter.exe"))) {
            throw "peanutbutter.exe not found"
          }
          Write-Host "Release dir: $src"
          "dir=$src" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Bundle VC++ runtime and verify DLLs
        shell: pwsh
        working-directory: .
        run: |
          $src = "${{ steps.winout.outputs.dir }}"
          if (-not [System.IO.Path]::IsPathRooted($src)) {
            $src = Join-Path "frontend" $src
          }
          ./scripts/bundle-windows-runtime.ps1 -ReleaseDir $src

      - name: Stage portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $src = "${{ steps.winout.outputs.dir }}"
          $stage = "dist\PeanutButter"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force "$src\*" $stage
          Get-ChildItem $stage | Format-Table Name, Length

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /? | Select-Object -First 3

      - name: Build setup exe
        shell: pwsh
        working-directory: .
        run: |
          $ver = (Select-String -Path frontend\pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches.Groups[1].Value
          if (-not $ver) { $ver = "0.2.0" }
          New-Item -ItemType Directory -Force -Path frontend\dist | Out-Null
          $src = (Resolve-Path "frontend\${{ steps.winout.outputs.dir }}").Path
          $out = (Resolve-Path "frontend\dist").Path
          $icon = (Resolve-Path "frontend\windows\runner\resources\app_icon.ico").Path
          $iss = (Resolve-Path "packaging\windows\peanutbutter.iss").Path
          if (-not (Test-Path (Join-Path $src "peanutbutter.exe"))) {
            throw "Missing peanutbutter.exe in $src"
          }
          Write-Host "ISCC source=$src"
          Write-Host "ISCC output=$out"
          Write-Host "ISCC icon=$icon"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$ver" `
            "/DMyAppSource=$src" `
            "/DMyAppOutputDir=$out" `
            "/DMyAppIcon=$icon" `
            $iss
          $setup = "frontend\dist\PeanutButter-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) {
            throw "setup exe was not produced"
          }
          Get-ChildItem frontend\dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: PeanutButter-windows-portable
          path: frontend/dist/PeanutButter/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PeanutButter-windows-setup
          path: frontend/dist/PeanutButter-windows-x64-setup.exe
          if-no-files-found: error

  macos:
    name: macOS (universal arm64 + x86_64)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.macos }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-macos-desktop

      # Universal libtorrent + OpenSSL are built from source (static) by the
      # vendored plugin; cache the toolchain output across runs.
      - name: Install native build deps
        run: brew install cmake ninja boost
      - uses: actions/cache@v4
        with:
          path: |
            frontend/plugins/libtorrent_flutter/.native-build/macos/*/prefix
            frontend/plugins/libtorrent_flutter/.native-build/macos/src
          key: ltf-macos-${{ hashFiles('frontend/plugins/libtorrent_flutter/tool/build_macos_native.sh') }}
      - name: Build libtorrent_flutter native (universal)
        run: plugins/libtorrent_flutter/tool/build_macos_native.sh

      - run: flutter pub get

      - name: Build universal macOS release
        run: |
          # Release.xcconfig: ARCHS=arm64 x86_64, ONLY_ACTIVE_ARCH=NO
          flutter build macos --release
          APP="build/macos/Build/Products/Release/peanutbutter.app"
          if [ ! -d "$APP" ]; then
            APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          fi
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "macOS .app bundle not found" >&2
            ls -la build/macos/Build/Products/Release || true
            exit 1
          fi
          BIN=$(find "$APP/Contents/MacOS" -type f | head -1)
          echo "Binary: $BIN"
          file "$BIN" || true
          lipo -info "$BIN" || true
          ARCHS="$(lipo -archs "$BIN" 2>/dev/null || true)"
          echo "Architectures: $ARCHS"
          if ! echo " $ARCHS " | grep -q " arm64 " || ! echo " $ARCHS " | grep -q " x86_64 "; then
            echo "Forcing universal xcodebuild (arm64 + x86_64)"
            (
              cd macos
              xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
                ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
                -destination 'generic/platform=macOS' build
            )
            APP="build/macos/Build/Products/Release/peanutbutter.app"
            if [ ! -d "$APP" ]; then
              APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
            fi
            BIN=$(find "$APP/Contents/MacOS" -type f | head -1)
            file "$BIN" || true
            lipo -info "$BIN" || true
          fi
          mkdir -p dist
          rm -rf dist/PeanutButter.app dist/PeanutButter-macos-universal.zip
          # Stable name (Flutter may emit peanutbutter.app).
          ditto "$APP" dist/PeanutButter.app
          # Actions' zip of a raw .app breaks Frameworks symlinks — package with ditto.
          ditto -c -k --sequesterRsrc --keepParent \
            dist/PeanutButter.app \
            dist/PeanutButter-macos-universal.zip
          rm -rf dist/PeanutButter.app
          ls -lh dist/PeanutButter-macos-universal.zip
          unzip -l dist/PeanutButter-macos-universal.zip | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: PeanutButter-macos-universal
          path: frontend/dist/PeanutButter-macos-universal.zip
          if-no-files-found: error
          # Already a proper macOS zip from ditto — don't recompress into a nest.
          compression-level: 0

  android-tv:
    name: Android TV APK
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.android_tv }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # The legacy `tools` package is no longer in the SDK repository.
          # Command-line tools come from this action; install only platform-tools here.
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build TV release APK
        working-directory: android-native
        run: |
          chmod +x ./gradlew
          ./gradlew :tv:assembleRelease --stacktrace
          out=tv/build/outputs/apk/release
          cp -f "$out/tv-universal-release.apk" "$GITHUB_WORKSPACE/PeanutButter-android-tv.apk"
          cp -f "$out/tv-arm64-v8a-release.apk" "$GITHUB_WORKSPACE/PeanutButter-android-tv-arm64-v8a.apk"
          cp -f "$out/tv-armeabi-v7a-release.apk" "$GITHUB_WORKSPACE/PeanutButter-android-tv-armeabi-v7a.apk"
          ls -lh "$GITHUB_WORKSPACE"/PeanutButter-android-tv*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PeanutButter-android-tv
          path: PeanutButter-android-tv*.apk
          if-no-files-found: error
