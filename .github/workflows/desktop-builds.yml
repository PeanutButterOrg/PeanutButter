# Build PeanutButter desktop clients (Windows / macOS / Linux)
#
# Native Windows and macOS binaries must be compiled on those OSes
# (Flutter cannot cross-compile desktop from Linux).
# Artifacts are uploaded on every push to main (and on version tags).

name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "frontend/**"
      - ".github/workflows/desktop-builds.yml"

concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev mpv

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package zip
        run: |
          mkdir -p dist/PeanutButter
          cp -a build/linux/x64/release/bundle/. dist/PeanutButter/
          printf '%s\n' '#!/usr/bin/env bash' 'cd "$(dirname "$0")"' \
            'export LD_LIBRARY_PATH="$PWD/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'exec ./peanutbutter "$@"' > dist/PeanutButter/run.sh
          chmod +x dist/PeanutButter/run.sh dist/PeanutButter/peanutbutter
          (cd dist && zip -qr PeanutButter-linux-x64.zip PeanutButter)

      - uses: actions/upload-artifact@v4
        with:
          name: PeanutButter-linux-x64
          path: frontend/dist/PeanutButter-linux-x64.zip
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $src = "build\windows\x64\runner\Release"
          if (-not (Test-Path $src)) {
            $src = Get-ChildItem -Path "build\windows" -Recurse -Directory -Filter Release |
              Where-Object { Test-Path (Join-Path $_.FullName "peanutbutter.exe") } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          Compress-Archive -Path "$src\*" -DestinationPath "dist\PeanutButter-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PeanutButter-windows-x64
          path: frontend/dist/PeanutButter-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release

      - name: Package zip
        run: |
          mkdir -p dist
          APP="build/macos/Build/Products/Release/peanutbutter.app"
          if [ ! -d "$APP" ]; then
            APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          fi
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "macOS .app bundle not found" >&2
            ls -la build/macos/Build/Products/Release || true
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/PeanutButter-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PeanutButter-macos
          path: frontend/dist/PeanutButter-macos.zip
          if-no-files-found: error
