# Packaging the release APKs (two flavors x five ABI splits, with LibVLC,
# FFmpeg and libtorrent native libraries) reads whole native libraries into
# memory and ran out of a 2 GB heap on CI. CI runners have 16 GB.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# The Kotlin daemon is a separate process with its own heap.
kotlin.daemon.jvmargs=-Xmx2g
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
