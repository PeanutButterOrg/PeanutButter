[package]
name = "peanutbutter"
version = "0.2.0"
edition = "2021"
description = "Self-hosted media catalog API (TMDB / OMDb / AniList metadata)"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
async-graphql = { version = "7", features = ["chrono", "uuid"] }
async-graphql-axum = "7"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "macros",
    "derive",
] }
tokio = { version = "1", features = ["full"] }
tokio-cron-scheduler = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
meilisearch-sdk = "0.28"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "set-header"] }
notify = "7"
mime_guess = "2"
regex = "1"
sha2 = "0.10"
hex = "0.4"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
http-body-util = "0.1"
bytes = "1"
ipnet = "2"
walkdir = "2"
moka = { version = "0.12", features = ["future"] }
librqbit = { version = "8.1.1", default-features = false, features = ["default-tls"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
